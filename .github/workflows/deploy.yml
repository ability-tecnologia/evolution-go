name: Deploy Evolution Go

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build and roll evolution_go
    runs-on: [self-hosted, abilitygas-vps]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build \
            -t ghcr.io/ability-tecnologia/evolution-go:0.7.3-reconnect-fix \
            --build-arg VERSION=0.7.3-reconnect-fix \
            .
          docker push ghcr.io/ability-tecnologia/evolution-go:0.7.3-reconnect-fix

      - name: Roll the Swarm service
        run: |
          docker service update \
            --image ghcr.io/ability-tecnologia/evolution-go:0.7.3-reconnect-fix \
            --with-registry-auth \
            --detach=false \
            evolution_go_evolution_go
